        // 問題をシャッフルし、ランダムに10問選択する関数
        function selectRandomQuestions(questionsArray, count) {
            // 配列をシャッフル
            const shuffled = [...questionsArray].sort(() => Math.random() - 0.5);
            // 指定された数だけ選択
            return shuffled.slice(0, count);
        }

        // ランダムに選択された10問の問題を取得
        const questions = selectRandomQuestions(allQuestions, 10);

        // 問題を表示する関数
        function displayQuestions() {
            const container = document.getElementById('quiz-container');
            
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                
                questionDiv.innerHTML = `
                    <h3>${index + 1}. ${q.question}</h3>
                    <div class="options">
                        ${q.options.map((option, optionIndex) => `
                            <label>
                                <input type="radio" name="question${index}" value="${optionIndex}">
                                ${option}
                            </label>
                        `).join('')}
                    </div>
                `;
                
                container.appendChild(questionDiv);
            });
        }

        // 結果を評価する関数
        function evaluateAnswers() {
            let correctCount = 0;
            const resultDiv = document.getElementById('result');
            
            // 各問題の正誤結果を表示するための要素を作成
            const resultsContainer = document.createElement('div');
            resultsContainer.id = 'detailed-results';
            
            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
                const questionDiv = document.querySelector(`.question:nth-child(${index + 1})`);
                
                if (selectedOption) {
                    const selectedIndex = parseInt(selectedOption.value);
                    
                    if (selectedIndex === q.correctAnswer) {
                        correctCount++;
                        // 正解の表示
                        const resultElement = document.createElement('div');
                        resultElement.className = 'answer-result answer-correct';
                        resultElement.textContent = `問題${index + 1}: 正解!`;
                        resultsContainer.appendChild(resultElement);
                    } else {
                        // 不正解の表示
                        const resultElement = document.createElement('div');
                        resultElement.className = 'answer-result answer-incorrect';
                        resultElement.innerHTML = `問題${index + 1}: 不正解<br>正解: ${q.options[q.correctAnswer]}`;
                        resultsContainer.appendChild(resultElement);
                    }
                } else {
                    // 回答がなかった場合
                    const resultElement = document.createElement('div');
                    resultElement.className = 'answer-result answer-incorrect';
                    resultElement.innerHTML = `問題${index + 1}: 回答なし<br>正解: ${q.options[q.correctAnswer]}`;
                    resultsContainer.appendChild(resultElement);
                }
            });
            
            // 正答率を計算
            const percentage = Math.round((correctCount / questions.length) * 100);
            
            // 結果を表示
            resultDiv.innerHTML = `正答率: ${percentage}% (${correctCount}/${questions.length})`;
            resultDiv.className = percentage >= 70 ? "correct" : "incorrect";
            resultDiv.classList.remove("hidden");
            
            // 詳細結果を追加
            const existingResults = document.getElementById('detailed-results');
            if (existingResults) {
                existingResults.remove();
            }
            document.getElementById('quiz-container').appendChild(resultsContainer);
        }

        // ページ読み込み時に問題を表示
        document.addEventListener('DOMContentLoaded', function() {
            displayQuestions();
            
            // 提出ボタンにイベントリスナーを追加
            document.getElementById('submit-btn').addEventListener('click', evaluateAnswers);
        });
