<script>
const questionBank = JSON.parse(document.querySelector('#question-bank').textContent);
const app = document.querySelector('#app');
const letters = ['A', 'B', 'C', 'D', 'E'];
const roundSize = 10;
let round = [];
let answers = [];
let current = 0;

function shuffle(items) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}

function startRound() {
  round = shuffle(questionBank).slice(0, roundSize).map(question => ({
    ...question,
    choices: shuffle(question.options.map((text, index) => ({text, correct: index === question.correct})))
  }));
  answers = Array(roundSize).fill(null);
  current = 0;
  showQuestion();
}

function setScreen(markup, focusSelector) {
  app.innerHTML = markup;
  window.scrollTo(0, 0);
  app.querySelector(focusSelector).focus({preventScroll:true});
}

function showHome() {
  app.replaceChildren(document.querySelector('#home').content.cloneNode(true));
  document.querySelector('#start').addEventListener('click', startRound);
}

function showQuestion() {
  const question = round[current];
  const answered = answers.filter(value => value !== null).length;
  const last = current === roundSize - 1;
  const choices = question.choices.map(({text}, index) =>
    `<label class="choice"><input type="radio" name="answer" value="${index}" ${answers[current] === index ? 'checked' : ''} required><span class="letter" aria-hidden="true">${letters[index]}</span><span>${text}</span></label>`
  ).join('');
  setScreen(`<section class="card" aria-label="クイズ">
    <div class="progress-info"><strong>第 ${current + 1} 問 / ${roundSize} 問</strong><span id="answered" aria-live="polite">回答済み ${answered} / ${roundSize}</span></div>
    <progress aria-label="回答済みの問題数" value="${answered}" max="${roundSize}"></progress>
    <form>
      <fieldset><legend tabindex="-1">${question.prompt}</legend>${choices}</fieldset>
      <div class="actions"><button type="button" class="secondary" id="back" ${current === 0 ? 'disabled' : ''}>← 前の問題</button>
      <button type="submit" id="next" ${answers[current] === null ? 'disabled' : ''}>${last ? '採点する' : '次の問題 →'}</button></div>
    </form>
  </section>`, 'legend');

  const form = app.querySelector('form');
  form.addEventListener('change', event => {
    answers[current] = Number(event.target.value);
    const count = answers.filter(value => value !== null).length;
    app.querySelector('#answered').textContent = `回答済み ${count} / ${roundSize}`;
    app.querySelector('progress').value = count;
    app.querySelector('#next').disabled = false;
  });
  app.querySelector('#back').addEventListener('click', () => {
    current--;
    showQuestion();
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (answers[current] === null) return;
    if (last) {
      showResults();
    } else {
      current++;
      showQuestion();
    }
  });
}

function showResults() {
  const score = round.filter((question, index) => question.choices[answers[index]].correct).length;
  const reviews = round.map((question, index) => {
    const selected = question.choices[answers[index]];
    const correct = question.choices.find(choice => choice.correct);
    const pages = question.pages.replace('-', '–');
    return `<details ${selected.correct ? '' : 'open'}>
      <summary><span class="verdict ${selected.correct ? '' : 'incorrect'}">${selected.correct ? '正解' : '不正解'}</span>第${index + 1}問　${question.prompt}</summary>
      <div class="detail-body">
        <p><strong>あなたの回答</strong>　${selected.text}</p>
        <p><strong>正答</strong>　${correct.text}</p>
        <p>${question.explanation}</p>
        <a class="source" href="../guideline.pdf#page=${question.pages.split('-')[0]}" target="_blank" rel="noopener">出典PDF ${pages}ページ目 ↗</a>
      </div>
    </details>`;
  }).join('');
  setScreen(`<section class="card" aria-labelledby="result-title">
      <p class="eyebrow">採点結果</p>
      <h1 id="result-title" tabindex="-1">正答率</h1>
      <p class="score">${score * 100 / roundSize}<span>%</span></p>
      <p>${roundSize}問中 ${score}問正解</p>
      <div class="result-actions"><button id="retry">新しい10問に挑戦 →</button><button class="secondary" id="toggle" aria-expanded="false" aria-controls="reviews">すべての解説を開く</button></div>
    </section>
    <section aria-labelledby="review-title">
      <div class="review-heading"><h2 id="review-title">問題の振り返り</h2></div>
      <div id="reviews">${reviews}</div>
    </section>`, '#result-title');
  app.querySelector('#retry').addEventListener('click', startRound);
  const toggle = app.querySelector('#toggle');
  const details = [...app.querySelectorAll('details')];
  function updateToggle() {
    const open = details.every(detail => detail.open);
    toggle.textContent = open ? 'すべての解説を閉じる' : 'すべての解説を開く';
    toggle.setAttribute('aria-expanded', String(open));
  }
  toggle.addEventListener('click', () => {
    const open = !details.every(detail => detail.open);
    details.forEach(detail => { detail.open = open; });
    updateToggle();
  });
  details.forEach(detail => detail.addEventListener('toggle', updateToggle));
  updateToggle();
}

showHome();
</script>
